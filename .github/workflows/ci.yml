name: GateKeeper CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend Build & Test (Java 25 + Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Run unit and Testcontainers integration tests
        run: mvn -f backend/pom.xml test -B

  frontend:
    name: Frontend Lint, Typecheck, Component Tests & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm --prefix frontend ci
      - name: Typecheck
        run: npm --prefix frontend run typecheck
      - name: Lint
        run: npm --prefix frontend run lint
      - name: Component tests
        run: npm --prefix frontend test
      - name: Production build
        run: npm --prefix frontend run build

  docker-e2e:
    name: Docker Compose Build & Playwright E2E
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Generate ephemeral .env and boot stack
        run: |
          chmod +x setup.sh
          ./setup.sh
      - name: Install Playwright Chromium
        run: npm --prefix frontend ci && npx --prefix frontend playwright install chromium
      - name: Run Playwright E2E workflow
        env:
          E2E_BASE_URL: http://localhost
        run: npm --prefix frontend run test:e2e
      - name: Tear down stack
        if: always()
        run: docker compose down -v

