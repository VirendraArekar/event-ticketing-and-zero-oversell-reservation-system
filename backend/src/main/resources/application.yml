spring:
  application:
    name: gatekeeper-backend
  lifecycle:
    timeout-per-shutdown-phase: 20s

  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:gatekeeper}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&rewriteBatchedStatements=true
    username: ${MYSQL_USER:gatekeeper}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 5
      connection-timeout: 15000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: native

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      replica: ${BACKEND_REPLICA_ID:local}

logging:
  structured:
    format:
      console: ecs
  level:
    com.gatekeeper: INFO

gatekeeper:
  jwt:
    secret: ${JWT_SECRET}
    access-expiration-seconds: ${JWT_ACCESS_EXPIRATION_SECONDS:900}
    refresh-expiration-seconds: ${JWT_REFRESH_EXPIRATION_SECONDS:604800}
  qr:
    hmac-secret: ${QR_HMAC_SECRET}
    token-grace-seconds: 86400
  checkin:
    early-window-minutes: 240
    late-window-minutes: 120
  booking:
    hold-duration-seconds: ${HOLD_DURATION_SECONDS:600}
    payment-deadline-seconds: ${PAYMENT_DEADLINE_SECONDS:86400}
    hold-expiring-warning-seconds: 120
    expiry-sweep-ms: 15000
  inventory:
    reconcile-interval-ms: 60000
  outbox:
    relay-interval-ms: 500
    initial-delay-ms: 1000
  rate-limit:
    enabled: true
    auth:
      capacity: 20
      refill-per-second: 0.5
    booking-user:
      capacity: 60
      refill-per-second: 5.0
    booking-ip:
      capacity: 1000
      refill-per-second: 100.0
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost}
  waiting-room:
    auto-spike-threshold: 1000
    slot-ttl-seconds: 300

